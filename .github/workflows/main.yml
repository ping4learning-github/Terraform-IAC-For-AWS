trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

# ---------------------------------------------------------
# 1. Checkout GitHub repository
# ---------------------------------------------------------
- checkout: self
  persistCredentials: true

# ---------------------------------------------------------
# 2. Install Terraform
# ---------------------------------------------------------
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: '1.5.0'

# ---------------------------------------------------------
# 3. Terraform Init
#    Local backend = state stored as terraform.tfstate
# ---------------------------------------------------------
- task: TerraformTaskV4@4
  displayName: Terraform Init
  inputs:
    provider: 'aws'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

# ---------------------------------------------------------
# 4. Terraform Validate
# ---------------------------------------------------------
- task: TerraformTaskV4@4
  displayName: Terraform Validate
  inputs:
    provider: 'aws'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

# ---------------------------------------------------------
# 5. Terraform Plan
# ---------------------------------------------------------
- task: TerraformTaskV4@4
  displayName: Terraform Plan
  inputs:
    provider: 'aws'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAWS: 'azuredevops-service-connection'
    commandOptions: '-out=tfplan'

# ---------------------------------------------------------
# 6. Terraform Apply
# ---------------------------------------------------------
- task: TerraformTaskV4@4
  displayName: Terraform Apply
  inputs:
    provider: 'aws'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAWS: 'azuredevops-service-connection'
    commandOptions: 'tfplan'

# ---------------------------------------------------------
# 7. Commit updated Terraform state back to GitHub
# ---------------------------------------------------------
- script: |
    git config user.email "azure-devops-pipeline@local"
    git config user.name "Azure DevOps Pipeline"

    git add terraform.tfstate

    if git diff --cached --quiet; then
      echo "No Terraform state changes to commit."
    else
      git commit -m "Update Terraform state [skip ci]"
      git push origin HEAD:main
    fi
  displayName: Commit Terraform State
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
