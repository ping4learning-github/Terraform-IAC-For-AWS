trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

# Checkout GitHub repository
- checkout: self

# Install Terraform
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: '1.5.0'

# Terraform Init
# Local backend -> terraform.tfstate stays in repository
- script: |
    terraform init
  displayName: Terraform Init
  workingDirectory: '$(System.DefaultWorkingDirectory)'

# Terraform Validate
- task: TerraformTaskV4@4
  displayName: Terraform Validate
  inputs:
    provider: 'aws'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

# Terraform Plan
- task: TerraformTaskV4@4
  displayName: Terraform Plan
  inputs:
    provider: 'aws'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAWS: 'azuredevops-service-connection'
    commandOptions: '-out=tfplan'

# Terraform Apply
- task: TerraformTaskV4@4
  displayName: Terraform Apply
  inputs:
    provider: 'aws'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAWS: 'azuredevops-service-connection'
    commandOptions: 'tfplan'
